<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R Studio Workspace</title>
    
    <style>
        /* Base Reset */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #030305; }
        
        /* The Secret Iframe Layer */
        #app-frame { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Cinematic Splash Screen Overlay */
        #splash { 
            position: absolute; inset: 0; z-index: 9999; background: #030305; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        /* State to trigger the smooth fade out */
        .splash-hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
        
        /* Floating Logo Animation */
        .logo-container { position: relative; animation: float 3s ease-in-out infinite; z-index: 2; }
        .logo { 
            width: 130px; height: 130px; border-radius: 28px; 
            box-shadow: 0 15px 50px rgba(0, 245, 212, 0.25), inset 0 0 0 1px rgba(255,255,255,0.1); 
            object-fit: cover; 
        }
        
        /* Ambient Glow Behind Logo */
        .glow { 
            position: absolute; width: 250px; height: 250px; 
            background: rgba(0, 245, 212, 0.15); filter: blur(60px); 
            border-radius: 50%; z-index: 1; animation: pulseGlow 2s infinite alternate; 
        }
        
        /* Sleek Loading Bar */
        .loader-track { width: 160px; height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-top: 50px; overflow: hidden; z-index: 2; }
        .loader-fill { height: 100%; background: #00F5D4; width: 0%; box-shadow: 0 0 15px #00F5D4; animation: fillBar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        /* Keyframes */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes pulseGlow { from { opacity: 0.5; transform: scale(0.9); } to { opacity: 1; transform: scale(1.1); } }
        @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }
    </style>
</head>
<body>

    <!-- Cinematic Splash Screen -->
    <div id="splash">
        <div class="glow"></div>
        <div class="logo-container">
            <!-- Ensure your uploaded image is named exactly 'logo.png' -->
            <img src="icon-512.png" alt="R Studio" class="logo" />
        </div>
        <div class="loader-track"><div class="loader-fill"></div></div>
    </div>

    <!-- The Full-Screen Render App -->
    <iframe id="app-frame" allow="clipboard-read; clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

    <script>
        // ---------------------------------------------------------
        // 🔹 CONFIGURATION
        // Replace this with your actual Render URL (e.g., https://r-studio-web.onrender.com)
        const RENDER_URL = "https://rstudio-udo7.onrender.com";
        // ---------------------------------------------------------

        // 1. Immediately start loading the heavy IDE in the background
        document.getElementById('app-frame').src = RENDER_URL;

        // 2. Wait exactly 2 seconds for the cinematic animation to finish
        setTimeout(() => {
            const splash = document.getElementById('splash');
            
            // Trigger the smooth CSS fade-out and scale-up effect
            splash.classList.add('splash-hidden');
            
            // Completely destroy the splash screen from memory after it turns invisible
            setTimeout(() => {
                splash.remove();
            }, 600); // Matches the 0.6s CSS transition time
            
        }, 2000); // 2000 milliseconds = 2 seconds
    </script>
</body>
</html>
